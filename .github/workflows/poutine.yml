name: Poutine CI Security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  poutine:
    name: poutine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions with Poutine
        uses: boostsecurityio/poutine-action@e240ebd3eff8b2db5a8e5f6b28f58739d7db2247 # v1.1.4
        with:
          format: sarif
          output: results.sarif

      # Fork and Dependabot pull requests receive a read-only token.
      # Keep scanning them, but upload SARIF only when security-events:write is usable.
      - name: Upload Poutine SARIF
        if: >-
          ${{ always() &&
          (github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
          category: poutine
