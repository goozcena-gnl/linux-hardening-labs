name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render social preview PNG
        run: |
          rsvg-convert             --width 1280             --height 640             docs/assets/social-preview.svg             --output docs/assets/social-preview.png

      - name: Version social preview PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add rendered social preview"
            git push origin HEAD:main
          fi

      - name: Publish v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; nothing to do."
          else
            gh release create v1.0.0               --target main               --title "TP1 & TP2 — Linux Hardening Labs"               --notes-file docs/releases/v1.0.0.md
          fi
