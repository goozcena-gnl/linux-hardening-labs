  <text x="54" y="105" class="title">TP1 · SSH + TOTP</text>
  <text x="54" y="134" class="sub">Sanitized transcript of demonstrated SSH behavior</text>
  <text x="54" y="150" class="term">$ ssh -p 2222 localadm@127.0.0.1</text>
  <text x="54" y="184" class="term">(localadm@127.0.0.1) Verification code:</text>
  <text x="54" y="218" class="term">(localadm@127.0.0.1) Password:</text>
  <text x="54" y="252" class="term">[localadm@tp-hardening-benito ~]$</text>
  <text x="54" y="286" class="term"></text>
  <text x="54" y="320" class="term">root@127.0.0.1: Permission denied (keyboard-interactive)</text>
  <text x="54" y="354" class="term">rescue: denied by DenyUsers</text>
  <text x="54" y="570" class="foot">Source: TP1 final report, SSH/MFA validation. Secrets omitted.</text>
